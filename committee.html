<script>
const committees = {
  UNSC: {
    title: "United Nations Security Council",
    intro: "A high-pressure diplomatic environment focused on international peace and security, where every decision can have far-reaching consequences.",
    format: "Security Council simulation",
    focus: "International peace, security and crisis diplomacy.",
    experience: "Best suited for delegates interested in strategic diplomacy and fast-moving debate."
  },

  UNHRC: {
    title: "United Nations Human Rights Council",
    intro: "A forum centred around international human rights, accountability and the diplomatic mechanisms used to address global challenges.",
    format: "Human rights council simulation",
    focus: "Human rights, accountability and international cooperation.",
    experience: "Ideal for delegates who enjoy policy-heavy discussion and diplomatic negotiation."
  },

  UNODC: {
    title: "United Nations Office on Drugs and Crime",
    intro: "A committee exploring international cooperation against transnational crime, organised crime and illicit activity.",
    format: "Specialised UN simulation",
    focus: "Crime prevention, drugs and international cooperation.",
    experience: "Suited for delegates who enjoy research-driven policy debate."
  },

  AIPPM: {
    title: "All India Political Parties Meet",
    intro: "A political simulation centred around Indian political discourse, competing ideologies and parliamentary strategy.",
    format: "Indian political simulation",
    focus: "Domestic politics, legislation and parliamentary debate.",
    experience: "Suited for delegates who enjoy political strategy and dynamic floor debate."
  },

  UNW: {
    title: "UN Women",
    intro: "A forum focused on advancing gender equality, empowerment and international development.",
    format: "United Nations simulation",
    focus: "Gender equality, empowerment and development.",
    experience: "Ideal for delegates interested in social policy and international development."
  },

  IPLA: {
    title: "IPL Auction",
    intro: "A fast-paced auction simulation where strategy, valuation and decision-making collide.",
    format: "Auction simulation",
    focus: "Team building, bidding strategy and management.",
    experience: "Designed for participants who enjoy competitive, high-speed simulations."
  }
};

const params = new URLSearchParams(window.location.search);
const code = (params.get("committee") || "UNSC").toUpperCase();

const committee = committees[code] || committees.UNSC;

document.title = `${code} | RELMUN 2026`;

document.getElementById("committeeCode").textContent = code;
document.getElementById("committeeTitle").textContent = committee.title;
document.getElementById("committeeIntro").textContent = committee.intro;
document.getElementById("formatText").textContent = committee.format;
document.getElementById("focusText").textContent = committee.focus;
document.getElementById("experienceText").textContent = committee.experience;

document.querySelector(".nav-toggle")?.addEventListener("click", () => {
  document.querySelector(".nav-links").classList.toggle("open");
});
</script>
